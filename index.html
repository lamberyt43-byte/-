<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MODERATION DESK</title>

  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
body {
  margin: 0;
  background: #050505;
  color: #e0e0e0;
  overflow: hidden;
}

/* ===== ROOM / MONITOR ===== */
#room {
  width: 100vw;
  height: 100vh;
  perspective: 1200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#monitor {
  width: 1100px;
  height: 650px;
  background: #0b0b0b;
  border-radius: 14px;
  box-shadow: 0 40px 120px rgba(0,0,0,.9);
  transform: rotateX(6deg);
  position: relative;
  overflow: hidden;
}
#monitor::after {
  content:"";
  position:absolute; inset:0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.02) 0,
    rgba(255,255,255,.02) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
}

/* ===== CUTSCENE ===== */
#cutscene {
  position:absolute; inset:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
#cutText {
  width:70%;
  font-size:22px;
  white-space:pre-line;
  line-height:1.6;
}

/* ===== APP ===== */
#app { display:none; height:100%; flex-direction:column; }

/* ===== HEADER / TABS ===== */
#header {
  height:48px;
  background:#111;
  padding:0 15px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #222;
}
#header span { color:#6aff6a; font-weight:bold; }

#tabs {
  display:flex;
  background:#0f0f0f;
  border-bottom:1px solid #222;
}
.tab {
  padding:12px 20px;
  cursor:pointer;
  border-right:1px solid #222;
}
.tab.active { background:#1a1a1a; color:#6aff6a; }

/* ===== CONTENT ===== */
#content { flex:1; padding:15px; overflow-y:auto; }
.panel { display:none; }
.panel.active { display:block; }

/* ===== FOOTER ===== */
#footer {
  height:40px;
  background:#0f0f0f;
  border-top:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

/* ===== UI ELEMENTS ===== */
button {
  background:#1a1a1a;
  color:#eee;
  border:1px solid #333;
  padding:6px 14px;
  cursor:pointer;
}
button:hover { background:#222; }
button:disabled { opacity:.4; cursor:not-allowed; }

.message { margin-bottom:10px; }
.curator { color:#6aff6a; }
.user { color:#ff6a6a; }

.complaint {
  border:1px solid #222;
  padding:12px;
  background:#101010;
  margin-bottom:12px;
}
.actions button { margin-right:6px; }

.glitch {
  animation: glitch .15s infinite;
}
@keyframes glitch {
  0%{transform:translate(0,0)}
  50%{transform:translate(1px,-1px)}
  100%{transform:translate(0,0)}
}
  </style>

  
</head>
<body>
  <div id="room">
<div id="monitor">

<!-- CUTSCENE -->
<div id="cutscene"><div id="cutText"></div></div>

<!-- APP -->
<div id="app">
  <div id="header"><span>MODERATION DESK APP</span></div>

  <div id="tabs">
    <div class="tab active" data-tab="messages">Сообщения</div>
    <div class="tab" data-tab="complaints">Жалобы</div>
    <div class="tab" data-tab="system">Система</div>
  </div>

  <div id="content">
    <div class="panel active" id="messages">
      <div id="chat"></div>
      <button id="startDay">▶ Начать рабочий день</button>
    </div>

    <div class="panel" id="complaints"></div>

    <div class="panel" id="system">
      <p>Статус смены: <b id="status">Ожидание</b></p>
      <p>Соответствие правилам: <b id="rules">100%</b></p>
      <p>Человечность: <b id="human">100%</b></p>
    </div>
  </div>

  <div id="footer">
    <div id="time">00:00 / 03:00</div>
    <button id="endDay" disabled>Закончить смену</button>
  </div>
</div>

</div>
</div>

  <script>
    /* ===== CUTSCENE ===== */
const cutLines = [
 "Уважаемый сотрудник.",
 "",
 "Ваша заявка была одобрена.",
 "Вы назначены модератором контента.",
 "",
 "Ваша смена: ночная.",
 "00:00 — 03:00.",
 "",
 "Вы не несёте ответственности,",
 "если действуете по правилам.",
 "",
 "Смена начинается сейчас."
];
let ci=0;
const ct=document.getElementById("cutText");
(function next(){
 if(ci<cutLines.length){
  ct.textContent+=cutLines[ci++]+"\n";
  setTimeout(next,700);
 } else {
  setTimeout(()=>{
   document.getElementById("cutscene").style.display="none";
   document.getElementById("app").style.display="flex";
  },1000);
 }
})();

/* ===== TABS ===== */
document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  t.classList.add("active");
  document.getElementById(t.dataset.tab).classList.add("active");
 };
});

/* ===== GAME STATE ===== */
let minutes=0;
const maxMinutes=180;
let rules=100;
let human=100;

const timeEl=document.getElementById("time");
const statusEl=document.getElementById("status");
const rulesEl=document.getElementById("rules");
const humanEl=document.getElementById("human");
const complaintsEl=document.getElementById("complaints");
const chat=document.getElementById("chat");
const endBtn=document.getElementById("endDay");

/* ===== CHAT ===== */
function msg(text,cls){
 const d=document.createElement("div");
 d.className="message "+cls;
 d.textContent=text;
 chat.appendChild(d);
 chat.scrollTop=9999;
}

/* ===== GENERATION ===== */
const starts=[
 "Это удалят, но",
 "Я не знаю куда писать,",
 "Если вы это читаете,",
 "Модераторы,",
 "Прошу,"
];
const middles=[
 "мне нужна помощь",
 "меня преследуют",
 "они врут",
 "это происходит сейчас",
 "я боюсь"
];
const ends=[
 "пожалуйста",
 "скриньте это",
 "не игнорируйте",
 "я больше не могу",
 "вы всё равно удалите"
];

function genPost(){
 return `"${starts.random()} ${middles.random()}, ${ends.random()}."`;
}
Array.prototype.random=function(){return this[Math.floor(Math.random()*this.length)]};

/* ===== COMPLAINT ===== */
function spawnComplaint(){
 complaintsEl.innerHTML="";
 const div=document.createElement("div");
 div.className="complaint";
 div.innerHTML=`
 <p><b>Пост:</b> ${genPost()}</p>
 <p><b>Жалоба:</b> Манипуляция</p>
 <div class="actions">
  <button onclick="resolve('delete')">❌ Удалить</button>
  <button onclick="resolve('warn')">⚠️ Предупредить</button>
  <button onclick="resolve('keep')">✅ Оставить</button>
 </div>`;
 complaintsEl.appendChild(div);
}

/* ===== RESOLVE ===== */
function resolve(type){
 minutes+=10;
 if(type==="delete"){ rules+=2; human-=6; }
 if(type==="keep"){ rules-=6; human+=2; }
 if(type==="warn"){ rules-=1; human-=1; }

 update();
 if(minutes>=maxMinutes){
  endBtn.disabled=false;
  statusEl.textContent="Смена завершена";
 } else spawnComplaint();
}

/* ===== UPDATE ===== */
function update(){
 timeEl.textContent=
  String(Math.floor(minutes/60)).padStart(2,"0")+":"+
  String(minutes%60).padStart(2,"0")+" / 03:00";
 rulesEl.textContent=rules;
 humanEl.textContent=human;

 if(human<40) document.getElementById("monitor").classList.add("glitch");
}

/* ===== START / END ===== */
document.getElementById("startDay").onclick=()=>{
 statusEl.textContent="Активна";
 msg("Куратор: Следуйте правилам.","curator");
 spawnComplaint();
 document.getElementById("startDay").remove();
};

endBtn.onclick=()=>{
 let ending="";
 if(rules>80 && human<40)
  ending="КОНЦОВКА: Идеальный сотрудник\nПлатформа стабильна. Пользователей нет.";
 else if(human>70)
  ending="КОНЦОВКА: Человек\nВы нарушали правила. Система вас запомнила.";
 else
  ending="КОНЦОВКА: Пустота\nВы выполнили смену. Что-то смотрит на вас.";

 alert(ending);
 location.reload();
};

update();
  </script>
</body>
</html>
